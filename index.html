<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="A full-stack Twitter/X clone built with React, Express, Prisma and MongoDB." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <title>X Clone</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var saved = JSON.parse(localStorage.getItem('x-theme') || '{}');
      if (saved.state && saved.state.theme) document.documentElement.dataset.theme = saved.state.theme;
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
